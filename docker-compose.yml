services:
  # ============================================================
  # MySQL 数据库
  # ============================================================
  mysql:
    image: mysql:8.0
    container_name: personal-finance-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: personal_finance
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./src/main/resources/schema.sql:/docker-entrypoint-initdb.d/02-schema.sql:ro
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # 后端 Spring Boot
  # ============================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: personal-finance-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # MySQL 连接（使用 Docker 网络服务名）
      DB_URL: jdbc:mysql://mysql:3306/personal_finance?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      # JWT 密钥
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: 86400000
      # CORS（允许前端访问）
      CORS_ORIGINS: http://localhost:80
      # 日志级别
      SPRING_LOGGING_LEVEL: INFO
    depends_on:
      mysql:
        condition: service_healthy

  # ============================================================
  # 前端 Vue + Nginx
  # ============================================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: personal-finance-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql_data:
    driver: local
