spring.application.name=personal-finance

# ==========================================================================
# Database
# ==========================================================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/personal_finance?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Schema init — enabled for local dev so schema.sql runs automatically
spring.sql.init.mode=${SQL_INIT_MODE:always}
spring.sql.init.continue-on-error=true

# ==========================================================================
# MyBatis-Plus
# ==========================================================================
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.slf4j.Slf4jImpl
mybatis-plus.mapper-locations=classpath:mapper/*.xml

# ==========================================================================
# JWT
# ==========================================================================
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ==========================================================================
# Redis
# ==========================================================================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=2

# ==========================================================================
# Cache — fallback to simple (in-memory) when Redis is unavailable
# ==========================================================================
spring.cache.type=${CACHE_TYPE:simple}

# ==========================================================================
# CORS
# ==========================================================================
cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# ==========================================================================
# Logging
# ==========================================================================
logging.level.com.example.personalfinance=INFO
logging.level.com.example.personalfinance.mapper=WARN
